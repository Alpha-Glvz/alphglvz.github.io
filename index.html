<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comunicador</title>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        #pantalla {
            flex-grow: 1;
            padding: 30px;
            font-size: 8vh; /* Letra dinámica gigante */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-y: auto;
        }
        .controles {
            display: flex;
            height: 20vh;
            min-height: 100px;
        }
        button {
            flex: 1;
            font-size: 2rem;
            border: none;
            font-weight: bold;
            color: white;
        }
        #btnHablar { background-color: #2e7d32; }
        #btnLimpiar { background-color: #c62828; }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div id="pantalla">Toca 'Hablar' para dictar</div>
    
    <div class="controles">
        <button id="btnHablar">🎤 Hablar</button>
        <button id="btnLimpiar">🗑️ Limpiar</button>
    </div>

    <script>
        const pantalla = document.getElementById('pantalla');
        const btnHablar = document.getElementById('btnHablar');
        const btnLimpiar = document.getElementById('btnLimpiar');
    
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-MX'; 
            recognition.continuous = true;      // Sigue escuchando aunque hagas pausas
            recognition.interimResults = true;  // Muestra resultados parciales
    
            let textoFinal = '';
    
            recognition.onstart = () => {
                pantalla.innerHTML = "<span style='color: #81c784;'>Escuchando... (Toca limpiar para detener)</span>";
                textoFinal = ''; // Reinicia el texto al volver a hablar
            };
    
            recognition.onresult = (event) => {
                let textoInterino = '';
                textoFinal = '';
    
                // Separa lo que ya entendió de lo que está procesando
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        textoFinal += event.results[i][0].transcript;
                    } else {
                        textoInterino += event.results[i][0].transcript;
                    }
                }
                
                // El texto final sale blanco, el que está procesando sale gris
                pantalla.innerHTML = `<span style="color: #ffffff;">${textoFinal}</span><span style="color: #888888;">${textoInterino}</span>`;
            };
    
            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    pantalla.innerText = "Error al escuchar. Intenta de nuevo.";
                }
            };
    
            btnHablar.addEventListener('click', () => {
                recognition.start();
            });
    
            btnLimpiar.addEventListener('click', () => {
                recognition.stop(); // Detiene el micrófono
                pantalla.innerText = "";
                textoFinal = '';
            });
    
        } else {
            pantalla.innerText = "Tu navegador no soporta el dictado por voz.";
        }
    </script>
</body>
</html>
